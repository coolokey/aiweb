<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>節日祝福產生器</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 浮動圖示容器 -->
    <div class="floating-icons" id="floatingIcons"></div>

    <div class="container">
        <!-- 標題區 -->
        <header>
            <div class="festival-icon">
                <i class="fas fa-gift"></i>
            </div>
            <h1 class="main-title">節日祝福產生器</h1>
            <h2 class="sub-title">快速生成創意節日祝福語</h2>
            <p class="description">為親朋好友送上最貼心的節日祝福！</p>
        </header>

        <!-- 生成區域 -->
        <main>
            <!-- 節日選擇 -->
            <div class="festival-select">
                <i class="fas fa-calendar-alt select-icon"></i>
                <select id="festivalSelect" class="festival-dropdown">
                    <option value="spring">春節 🏮</option>
                    <option value="lantern">元宵節 🎆</option>
                    <option value="qingming">清明節 🌿</option>
                    <option value="labor">勞動節 👷</option>
                    <option value="dragon">端午節 🛶</option>
                    <option value="ghost">中元節 🏮</option>
                    <option value="moon">中秋節 🌕</option>
                    <option value="double">重陽節 🍊</option>
                    <option value="halloween">萬聖節 🎃</option>
                    <option value="christmas">聖誕節 🎄</option>
                    <option value="newyear">元旦 🎉</option>
                    <option value="mother">母親節 💐</option>
                    <option value="father">父親節 👔</option>
                    <option value="children">兒童節 🎈</option>
                    <option value="youth">青年節 💪</option>
                    <option value="lover">情人節 💝</option>
                    <option value="teacher">教師節 📚</option>
                    <option value="birthday">生日 🎂</option>
                </select>
            </div>

            <!-- 文案分類選擇 -->
            <div class="category-tags">
                <button class="tag active" data-category="family"><i class="fas fa-home"></i> 家人祝福</button>
                <button class="tag" data-category="friend"><i class="fas fa-user-friends"></i> 朋友祝福</button>
                <button class="tag" data-category="business"><i class="fas fa-briefcase"></i> 商務祝福</button>
                <button class="tag" data-category="humor"><i class="fas fa-laugh-beam"></i> 幽默祝福</button>
            </div>

            <!-- 生成按鈕 -->
            <button id="generateBtn" class="generate-btn">
                <i class="fas fa-magic"></i> 生成祝福語
            </button>

            <!-- 文案展示框 -->
            <div id="wishDisplay" class="wish-display">
                <i class="fas fa-quote-left quote-icon"></i>
                請選擇節日並點擊生成按鈕...
                <i class="fas fa-quote-right quote-icon"></i>
            </div>

            <!-- 複製成功提示 -->
            <div id="copyNotification" class="copy-notification">
                <i class="fas fa-check-circle"></i> 複製成功！
            </div>
        </main>

        <!-- 底部提示 -->
        <footer>
            <p class="hint"><i class="fas fa-info-circle"></i> 選擇節日，點擊按鈕獲取專屬祝福語</p>
            <p id="countdown" class="countdown"><i class="fas fa-hourglass-half"></i> <span></span></p>
        </footer>
    </div>

    <!-- 音效文件 -->
    <audio id="clickSound" src="click.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
